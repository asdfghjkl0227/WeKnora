name: Evaluation Gate

# 质量评测门禁：定时 + 提交 PR 时跑一次评测，指标低于阈值则让 CI 失败。
# 阈值见 scripts/eval-thresholds.json。

on:
  schedule:
    # 每天 UTC 03:00 跑一次（北京时间 11:00）
    - cron: '0 3 * * *'
  pull_request:
    paths:
      - 'internal/**'
      - 'migrations/**'
      - 'config/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/evaluation.yml'
  workflow_dispatch:

concurrency:
  group: evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    name: 评测门禁
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 准备环境配置
        run: |
          cp .env.example .env

      - name: 启动 WeKnora（用本次提交的代码构建镜像）
        run: docker compose up -d --build app docreader

      - name: 等待服务就绪
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health >/dev/null 2>&1; then
              echo "服务已就绪"
              exit 0
            fi
            echo "等待服务启动（$i/60）..."
            sleep 5
          done
          echo "服务启动超时" >&2
          exit 1

      - name: 初始化账号与模型
        env:
          WEKNORA_BASE_URL: http://localhost:8080
          WEKNORA_ADMIN_EMAIL: ${{ secrets.WEKNORA_ADMIN_EMAIL }}
          WEKNORA_ADMIN_PASSWORD: ${{ secrets.WEKNORA_ADMIN_PASSWORD }}
          EMBEDDING_MODEL_NAME: ${{ secrets.EMBEDDING_MODEL_NAME }}
          EMBEDDING_BASE_URL: ${{ secrets.EMBEDDING_BASE_URL }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: bash scripts/ci-setup.sh

      - name: 运行评测
        env:
          WEKNORA_BASE_URL: http://localhost:8080
          WEKNORA_ADMIN_EMAIL: ${{ secrets.WEKNORA_ADMIN_EMAIL }}
          WEKNORA_ADMIN_PASSWORD: ${{ secrets.WEKNORA_ADMIN_PASSWORD }}
        run: bash scripts/evaluate.sh

      - name: 阈值判断
        run: python3 scripts/check-eval-threshold.py
